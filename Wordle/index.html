    <title>Wordle · Arcade</title>
    <link rel="stylesheet" href="../_shared/arcade.css">
    <style>
        :root { --accent: #22c55e; --accent-2: #eab308; --accent-ink: #03140a; --hit: #22a355; --near: #c9a20f; --miss: #353c57; --tile: 58px; }
        body.contrast { --hit: #f5793a; --near: #85c0f9; }
        .stage { justify-content: space-between; gap: 10px; padding: 10px 8px 12px; }
        .modes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .grid { display: grid; grid-template-rows: repeat(var(--rows, 6), var(--tile)); gap: 6px; margin: auto 0; }
        .row { display: grid; grid-template-columns: repeat(var(--len, 5), var(--tile)); gap: 6px; }
        .row.shake { animation: shake 0.35s; }
        .tile {
            width: var(--tile); height: var(--tile);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--line-2); border-radius: 8px;
            font-size: calc(var(--tile) * 0.52); font-weight: 900; text-transform: uppercase;
            background: transparent; color: var(--text);
            user-select: none;
        }
        .tile.filled { border-color: #6b7599; animation: pop 0.1s; }
        .tile.hit, .tile.near, .tile.miss { border-color: transparent; color: #fff; }
        .tile.hit { background: var(--hit); }
        .tile.near { background: var(--near); }
        .tile.miss { background: var(--miss); }
        .tile.flip { animation: flip 0.5s ease forwards; }
        .tile.bounce { animation: bounce 0.6s ease; }
        @keyframes pop { 50% { transform: scale(1.1); } }
        @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
        @keyframes bounce { 0%, 20% { transform: translateY(0); } 40% { transform: translateY(-22px); } 60% { transform: translateY(4px); } 80% { transform: translateY(-6px); } 100% { transform: none; } }
        .kb { display: flex; flex-direction: column; gap: 7px; width: min(520px, 100%); }
        .kb .krow { display: flex; gap: 5px; justify-content: center; }
        .key {
            flex: 1; max-width: 46px; height: 54px; border: none; border-radius: 7px;
            background: #4b5578; color: var(--text); font: inherit; font-weight: 800; font-size: 0.95rem; text-transform: uppercase;
            cursor: pointer; touch-action: manipulation; transition: background 0.2s, transform 0.06s;
        }
        .key:active { transform: scale(0.94); }
        .key.wide { max-width: 70px; flex: 1.5; font-size: 0.72rem; }
        .key.hit { background: var(--hit); color: #fff; }
        .key.near { background: var(--near); color: #fff; }
        .key.miss { background: #262b40; color: #6b7392; }
        .dist { text-align: left; margin-top: 12px; }
        .dist .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.85rem; }
        .dist .bar-row b { width: 12px; }
        .dist .bar-row span { background: var(--miss); color: #fff; font-weight: 700; padding: 1px 8px; border-radius: 4px; text-align: right; min-width: 24px; }
        .dist .bar-row.cur span { background: var(--hit); }
        .settings { text-align: left; display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
        .settings label { display: flex; justify-content: space-between; gap: 10px; align-items: center; cursor: pointer; }
        .settings label small { display: block; color: var(--muted); font-size: 0.76rem; }
        .settings input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
        .poople { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: auto 0; width: min(420px, 100%); }
        .poople .plead { text-align: center; color: var(--muted); font-size: 0.9rem; line-height: 1.35; }
        .poople .plead b { color: var(--text); }
        .pchain { display: flex; flex-direction: column; gap: 5px; max-height: calc(100vh - 470px); min-height: 150px; overflow-y: auto; padding: 4px 8px; width: 100%; align-items: center; }
        .prow { display: flex; gap: 5px; align-items: center; }
        .prow .tile { width: 44px; height: 44px; font-size: 1.4rem; }
        .prow .tile.start { background: #4b5578; border-color: transparent; color: #fff; }
        .prow .tile.chg { background: var(--near); border-color: transparent; color: #fff; }
        .prow .tile.same { background: var(--miss); border-color: transparent; color: #cdd3ea; }
        .prow .tile.goal { border-color: transparent; background: #7a4a24; color: #fff; }
        .prow .tile.goal.got { background: var(--hit); }
        .prow .tile.typing { border-color: #6b7599; border-style: dashed; color: var(--muted); }
        .prow .tile.typing.filled { color: var(--text); border-style: solid; }
        .prow .num { width: 22px; text-align: right; color: var(--dim); font-size: 0.78rem; font-weight: 700; }
        .pbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .pdots { color: var(--dim); font-weight: 900; line-height: 0.6; }
        .answer { font-size: 1.6rem; font-weight: 900; letter-spacing: 0.2em; color: var(--text); text-transform: uppercase; }
        @media (max-height: 700px) { :root { --tile: 48px; } .key { height: 46px; } }
        @media (max-height: 600px) { :root { --tile: 40px; } .key { height: 40px; } }
    </style>
</head>
<body class="no-scroll no-select">
    <header class="topbar">
        <a class="btn ghost sm hub-link" href="../GameIndex.html">Hub</a>
        <h1 class="title">Wordle</h1>
        <div class="stats">
            <span class="chip accent">Streak <b id="streak">0</b></span>
            <span class="chip gold">Wins <b id="winsChip">0</b></span>
        </div>
        <div class="actions">
            <button class="btn sm icon" id="statsBtn" title="Statistics">📊</button>
            <button class="btn sm icon" id="setBtn" title="Settings">⚙</button>
            <button class="btn sm icon" data-mute>🔊</button>
        </div>
    </header>

    <main class="stage">
        <div class="modes">
            <div class="seg" id="modeSeg">
                <button class="btn sm" data-mode="daily">Daily</button>
                <button class="btn sm" data-mode="unlimited">Unlimited</button>
                <button class="btn sm" data-mode="poople" title="Word ladder: change one letter at a time until you reach POOP">Poople</button>
            </div>
            <div class="seg" id="lenSeg" title="Word length">
                <button class="btn sm" data-len="4">4</button>
                <button class="btn sm" data-len="5">5</button>
                <button class="btn sm" data-len="6">6</button>
                <button class="btn sm" data-len="7">7</button>
            </div>
            <button class="btn sm" id="newBtn" hidden>New word</button>
            <span class="tag" id="hardTag" hidden>Hard mode</span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="poople" id="poople" hidden>
            <div class="plead">Change <b>one letter at a time</b>, every step must be a real word, until you reach <b>POOP</b>.</div>
            <div class="pchain" id="pchain"></div>
            <div class="pbtns">
                <button class="btn sm" id="pUndo">Undo</button>
                <button class="btn sm" id="pHint">Hint</button>
                <button class="btn sm" id="pNew">New puzzle</button>
            </div>
        </div>
        <div class="kb" id="kb"></div>

        <div class="overlay fixed" id="endOv" hidden>
            <div class="modal">
                <h2 id="endTitle">Splendid!</h2>
                <p>The word was</p>
                <div class="answer" id="endWord"></div>
                <div class="stat-grid" id="endStats"></div>
                <div class="dist" id="endDist"></div>
                <p class="small" id="nextDaily"></p>
                <div class="actions">
                    <button class="btn primary lg" id="againBtn">Play unlimited</button>
                    <button class="btn" id="shareBtn">Share</button>
                    <button class="btn ghost" id="closeEnd">Close</button>
                </div>
            </div>
        </div>
        <div class="overlay fixed" id="setOv" hidden>
            <div class="modal">
                <h2>Settings</h2>
                <div class="settings">
                    <label><span>Hard mode<small>Any revealed hints must be used in later guesses. Starts with your next word.</small></span><input type="checkbox" id="optHard"></label>
                    <label><span>High contrast colours<small>Orange and blue instead of green and yellow.</small></span><input type="checkbox" id="optContrast"></label>
                    <label><span>Accept any letters<small>Skip the dictionary check for guesses.</small></span><input type="checkbox" id="optAny"></label>
                </div>
                <div class="actions"><button class="btn primary" id="closeSet">Done</button></div>
            </div>
        </div>
    </main>

            if (typing.length < 4) { toast('Not enough letters'); Arcade.sfx('bad'); return; }
            if (!P4.has(typing)) { toast('Not in word list'); Arcade.sfx('bad'); return; }
            if (diffCount(cur, typing) !== 1) { toast(typing === cur ? 'That is the same word' : 'Change exactly one letter'); Arcade.sfx('bad'); return; }
            pg.chain.push(typing);
            typing = '';
            if (pg.chain[pg.chain.length - 1] === GOAL) { pg.done = true; poopleRecord(); setTimeout(poopleEnd, 600); Arcade.sfx('win'); }
            else Arcade.sfx('click');
            Arcade.save('arcade.wordle.poople', pg);
            paintPoople();
        }
        function poopleRecord() {
            const ps = poopleStats(), steps = pg.chain.length - 1;
            ps.solved++; ps.streak++;
            if (ps.best === null || steps - pg.par < ps.best) ps.best = steps - pg.par;
            Arcade.save(poopleStatsKey, ps);
            hud();
        }
        function poopleEnd() {
            const ps = poopleStats(), steps = pg.chain.length - 1;
            $('endTitle').textContent = pg.done ? (steps <= pg.par ? 'Perfect ladder! 💩' : 'POOP reached! 💩') : 'Poople';
            $('endTitle').className = pg.done ? 'good' : '';
            $('endWord').previousElementSibling.hidden = true;
            $('endWord').textContent = pg.chain.join(' → ');
            $('endWord').style.cssText = 'font-size:1rem;letter-spacing:0.05em;line-height:1.5';
            $('endStats').innerHTML = '';
            for (const [label, v] of [['Steps', steps], ['Shortest', pg.par], ['Hints', pg.hints], ['Solved', ps.solved]]) {
                const d = document.createElement('div'); d.innerHTML = `<small>${label}</small><b>${v}</b>`; $('endStats').appendChild(d);
            }
            $('endDist').innerHTML = ps.best === null ? '' : `<p class="small" style="text-align:center">Closest to shortest: ${ps.best === 0 ? 'a perfect ladder' : '+' + ps.best + ' step' + (ps.best === 1 ? '' : 's')}</p>`;
            $('nextDaily').textContent = '';
            $('againBtn').textContent = 'New puzzle';
            $('shareBtn').hidden = !pg.done;
            Arcade.show('endOv');
        }
        $('pUndo').onclick = () => { if (pg.done || pg.chain.length < 2) return; pg.chain.pop(); typing = ''; Arcade.save('arcade.wordle.poople', pg); paintPoople(); Arcade.sfx('click'); };
        $('pHint').onclick = () => {
            if (pg.done) return;
            const cur = pg.chain[pg.chain.length - 1], d = PDIST.get(cur);
            const next = pNeighbours(cur).filter(w => PDIST.get(w) === d - 1);
            if (!next.length) { toast('Try undoing a step, this word is a dead end'); return; }
            pg.hints++;
            const w = next[0], i = [...w].findIndex((ch, k) => ch !== cur[k]);
            toast(pg.hints > 2 ? `Try ${w.toUpperCase()}  (${d} step${d === 1 ? '' : 's'} to go)` : `Try changing letter ${i + 1}  (${d} step${d === 1 ? '' : 's'} to go)`);
            Arcade.save('arcade.wordle.poople', pg);
        };
        $('pNew').onclick = () => {
            if (!pg.done && pg.chain.length > 1) { if (!sureTwice('Give up on this puzzle?')) return; const ps = poopleStats(); ps.streak = 0; Arcade.save(poopleStatsKey, ps); }
            startPoople(true);
        };
        // in-page replacement for confirm(): browsers can permanently suppress confirm() dialogs, which made buttons silently do nothing
        let _armed = null;
        function sureTwice(msg) {
            if (_armed === msg) { _armed = null; return true; }
            _armed = msg; Arcade.toast(msg + ' Click again to confirm.', '', 2500);
            setTimeout(() => { if (_armed === msg) _armed = null; }, 3000);
            return false;
        }
        const anyOverlay = () => !$('endOv').hidden || !$('setOv').hidden;

        /* ---------- End / stats ---------- */
        function showEnd() {
            const s = loadStats();
            const h = $('endTitle');
            if (game.done) {
                h.textContent = game.won ? cheer(game.guesses.length) : 'So close!';
                h.className = game.won ? 'good' : 'bad';
                $('endWord').textContent = game.answer;
            } else {
                h.textContent = 'Statistics'; h.className = '';
                $('endWord').textContent = '';
            }
            $('endWord').previousElementSibling.hidden = !game.done;
            $('endStats').innerHTML = '';
            for (const [label, v] of [['Played', s.played], ['Win %', s.played ? Math.round(s.wins / s.played * 100) : 0], ['Streak', s.streak], ['Max streak', s.maxStreak]]) {
                const d = document.createElement('div');
                d.innerHTML = `<small>${label}</small><b>${v}</b>`;
                $('endStats').appendChild(d);
            }
            const max = Math.max(1, ...s.dist);
            $('endDist').innerHTML = '<p class="small" style="text-align:center;margin:0 0 6px">Guess distribution · ' + (mode === 'daily' ? 'Daily' : 'Unlimited') + ' · ' + wlen + ' letters</p>';
            s.dist.slice(0, rows()).forEach((n, i) => {
                const row = document.createElement('div');
                row.className = 'bar-row' + (game.done && game.won && game.guesses.length === i + 1 ? ' cur' : '');
                row.innerHTML = `<b>${i + 1}</b><span style="width:${8 + n / max * 82}%">${n}</span>`;
                $('endDist').appendChild(row);
            });
            if (mode === 'daily') {
                const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                $('nextDaily').textContent = game.done ? `Next daily word in ${Arcade.time((next - now) / 1000)}` : '';
            } else $('nextDaily').textContent = '';
            $('againBtn').textContent = mode === 'daily' ? 'Play unlimited' : 'Next word';
            $('shareBtn').hidden = !game.done;
            Arcade.show('endOv');
        }

        function shareText() {
            if (mode === 'poople') return `Arcade Poople 💩 ${pg.chain.length - 1} steps (shortest ${pg.par})\n\n` + pg.chain.map(w => w.toUpperCase()).join(' → ');
            const lines = game.guesses.map(g => score(g, game.answer).map(r => r === 'hit' ? (opts.contrast ? '🟧' : '🟩') : r === 'near' ? (opts.contrast ? '🟦' : '🟨') : '⬛').join(''));
            const head = `Arcade Wordle ${wlen === 5 ? '' : wlen + '-letter '}${mode === 'daily' ? '#' + game.day : '(unlimited)'} ${game.won ? game.guesses.length : 'X'}/${rows()}${game.hard ? '*' : ''}`;
            return head + '\n\n' + lines.join('\n');
        }

        /* ---------- Wiring ---------- */
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key === 'Escape') { Arcade.hide('endOv'); Arcade.hide('setOv'); return; }
            if (e.key === 'Enter' || e.key === 'Backspace' || /^[a-z]$/i.test(e.key)) { e.preventDefault(); press(e.key); }
        });
        document.querySelectorAll('#modeSeg .btn').forEach(b => b.onclick = () => {
            if (b.dataset.mode === mode) return;
            mode = b.dataset.mode; Arcade.save('arcade.wordle.mode', mode);
            Arcade.sfx('select');
            newGame();
        });
        document.querySelectorAll('#lenSeg .btn').forEach(b => b.onclick = () => {
            if (+b.dataset.len === wlen) return;
            wlen = +b.dataset.len; Arcade.save('arcade.wordle.len', wlen);
            Arcade.sfx('select');
            newGame();
        });
        $('newBtn').onclick = () => { if (!game.done && game.guesses.length && !sureTwice('Give up on this word?')) return; if (!game.done && game.guesses.length) { game.done = true; game.won = false; recordResult(); } newGame(true); };
        $('againBtn').onclick = () => {
            Arcade.hide('endOv');
            $('endWord').style.cssText = '';
            if (mode === 'poople') { startPoople(true); return; }
            if (mode === 'daily') { mode = 'unlimited'; Arcade.save('arcade.wordle.mode', mode); newGame(); if (game.done) newGame(true); }
            else newGame(true);
        };
        $('closeEnd').onclick = () => Arcade.hide('endOv');
        $('statsBtn').onclick = () => { $('endWord').style.cssText = ''; if (mode === 'poople') poopleEnd(); else showEnd(); };
        $('shareBtn').onclick = async () => {
            try { await navigator.clipboard.writeText(shareText()); toast('Copied to clipboard'); }
            catch (e) { prompt('Copy your result:', shareText()); }
        };
        $('setBtn').onclick = () => {
            $('optHard').checked = opts.hard; $('optContrast').checked = opts.contrast; $('optAny').checked = opts.any;
            Arcade.show('setOv');
        };
        for (const [id, key] of [['optHard', 'hard'], ['optContrast', 'contrast'], ['optAny', 'any']]) {
            $(id).onchange = () => {
                opts[key] = $(id).checked;
                Arcade.save('arcade.wordle.opts', opts);
                // hard mode can be switched on before the first guess of the current word
                if (key === 'hard' && !game.guesses.length) { game.hard = opts.hard; persist(); }
                hud();
            };
        }
        $('closeSet').onclick = () => Arcade.hide('setOv');
        window.__wordle = { LISTS, score }; // for automated tests

        newGame();
    })();
    </script>
</body>
</html>
