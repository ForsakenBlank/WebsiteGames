<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Infinite Ink · Arcade</title>
    <link rel="stylesheet" href="../_shared/arcade.css">
    <style>
        :root { --accent: #38bdf8; --accent-2: #c084fc; --accent-ink: #03141f; }
        .studio { position: relative; flex: 1; min-height: 0; overflow: hidden; }
        #paper, #live, #ui { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
        #live, #ui { pointer-events: none; }
        .glass {
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line-2);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }
        .studio.zen .rail, .studio.zen .ctxbar, .studio.zen .dock, .studio.zen .minimap, .studio.zen .zoom-chip, .studio.zen .timeline { display: none; }

        /* ---------- Animation timeline (bottom) ---------- */
        .timeline { position: absolute; left: 74px; right: 300px; bottom: 12px; z-index: 11; display: flex; align-items: center; gap: 8px; padding: 6px 10px; overflow-x: auto; scrollbar-width: none; }
        .timeline::-webkit-scrollbar { display: none; }
        .tl-frames { display: flex; gap: 4px; overflow-x: auto; flex: 0 1 auto; min-width: 64px; padding: 2px; scrollbar-width: thin; }
        .tl-cell { position: relative; flex: none; width: 56px; height: 38px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg-2); padding: 0; cursor: pointer; overflow: hidden; }
        .tl-cell canvas { width: 100%; height: 100%; display: block; }
        .tl-cell b { position: absolute; left: 4px; bottom: 1px; font-size: 0.6rem; color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000; }
        .tl-cell.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .timeline .cc { width: 92px; }
        #animBtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

        /* ---------- Tool rail (left) ---------- */
        .rail {
            position: absolute; left: 10px; top: 10px; z-index: 12; width: 52px;
            display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0;
            max-height: calc(100% - 20px); overflow-y: auto; scrollbar-width: none;
        }
        .rail::-webkit-scrollbar { display: none; }
        .rbtn {
            position: relative; width: 40px; height: 40px; flex: none; display: grid; place-items: center;
            border-radius: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }
        .rbtn:hover { background: var(--surface-2); color: var(--text); }
        .rbtn.on { background: var(--accent); color: var(--accent-ink); }
        .rbtn .more { position: absolute; right: 4px; bottom: 4px; width: 0; height: 0; border-left: 5px solid transparent; border-bottom: 5px solid currentColor; opacity: 0.55; }
        .rail-sep { width: 28px; height: 1px; background: var(--line-2); margin: 4px 0; flex: none; }
        .well { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line-2); padding: 3px; background: none; cursor: pointer; flex: none; margin: 2px 0; }
        .well:hover { border-color: var(--accent); }
        .well i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); }
        .vslider { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; touch-action: none; cursor: ns-resize; padding: 2px 0; }
        .vs-track { position: relative; width: 8px; height: 104px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--line-2); }
        .vs-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px; background: var(--accent); opacity: 0.6; }
        .vs-thumb { position: absolute; left: 50%; width: 22px; height: 12px; margin-left: -11px; margin-bottom: -6px; border-radius: 5px; background: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55); }
        .vs-val { font-size: 0.66rem; color: var(--text); font-variant-numeric: tabular-nums; }
        .vs-cap { font-size: 0.56rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
        .size-bubble { position: absolute; z-index: 40; pointer-events: none; display: grid; place-items: center; border-radius: 14px; padding: 10px; }
        .size-bubble i { display: block; border-radius: 50%; }

        /* ---------- Context bar (tool options, top) ---------- */
        .ctxbar {
            position: absolute; top: 10px; left: 74px; z-index: 11;
            display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-height: 50px;
            max-width: calc(100% - 84px); overflow-x: auto; scrollbar-width: none;
        }
        .ctxbar::-webkit-scrollbar { display: none; }
        .ctx-tool {
            display: flex; align-items: center; gap: 7px; padding: 6px 10px 6px 8px; border-radius: 9px;
            border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); font: inherit;
            font-weight: 650; font-size: 0.86rem; cursor: pointer; white-space: nowrap; flex: none;
        }
        .ctx-tool:hover { border-color: var(--accent); }
        .ctx-tool .caret { color: var(--muted); font-size: 0.7rem; }
        .ctx-sep { width: 1px; align-self: stretch; background: var(--line-2); flex: none; margin: 2px 0; }
        .cc { display: flex; flex-direction: column; gap: 1px; width: 118px; flex: none; }
        .cc .cl, .cgrp .cl { display: flex; justify-content: space-between; gap: 8px; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); white-space: nowrap; }
        .cc .cl b { color: var(--text); letter-spacing: 0; text-transform: none; font-weight: 650; font-size: 0.7rem; }
        .cc input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); height: 18px; }
        .cgrp { display: flex; flex-direction: column; gap: 2px; flex: none; }
        .cseg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line-2); }
        .cseg button { border: 0; background: transparent; color: var(--muted); padding: 3px 8px; border-radius: 6px; font: inherit; font-size: 0.76rem; cursor: pointer; white-space: nowrap; }
        .cseg button:hover { color: var(--text); }
        .cseg button.on { background: var(--surface-3); color: var(--text); box-shadow: 0 0 0 1px var(--line-2); }
        .ctog { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--muted); font: inherit; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }
        .ctog:hover { color: var(--text); }
        .ctog[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--bg-2)); }
        .ctog:disabled { opacity: 0.4; cursor: not-allowed; }
        .ctog.danger { color: var(--bad); }
        .ctog.icon { padding: 6px 7px; }
        .ctxbar .hint { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
        .ctxbar input.glyph { width: 48px; padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); font: inherit; font-size: 1rem; text-align: center; }
        .ctxbar select { padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); font: inherit; font-size: 0.9rem; }

        /* ---------- Popovers ---------- */
        .pop { position: absolute; z-index: 30; padding: 12px; max-height: calc(100% - 20px); max-width: calc(100% - 20px); overflow-y: auto; }
        .pop h4 { margin: 0 0 7px; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
        .pop h4:not(:first-child) { margin-top: 12px; }
        .brush-grid { display: grid; grid-template-columns: repeat(2, 156px); gap: 6px; }
        .bcard { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); padding: 4px; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
        .bcard:hover { border-color: var(--line-2); background: var(--surface-2); }
        .bcard canvas { width: 100%; height: 40px; display: block; border-radius: 7px; }
        .bcard span { display: flex; justify-content: space-between; align-items: center; font-size: 0.76rem; font-weight: 600; padding: 4px 4px 1px; }
        .bcard span kbd { font-size: 0.62rem; padding: 0 4px; }
        .bcard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
        .shape-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; min-width: 230px; }
        .shape-list button { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); color: var(--text); font: inherit; font-size: 0.82rem; cursor: pointer; }
        .shape-list button.on { border-color: var(--accent); }
        .sv { position: relative; width: 236px; height: 150px; border-radius: 10px; touch-action: none; cursor: crosshair; }
        .sv canvas, .hue canvas { width: 100%; height: 100%; display: block; border-radius: inherit; }
        .knob { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.4); pointer-events: none; }
        .hue { position: relative; width: 236px; height: 14px; border-radius: 8px; margin-top: 10px; touch-action: none; cursor: ew-resize; }
        .hue .knob { top: 50%; }
        .cp-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
        .cp-row input[type=text] { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); font-family: var(--mono); font-size: 0.85rem; }
        .cp-prev { width: 44px; height: 30px; border-radius: 8px; display: flex; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-2); flex: none; }
        .cp-prev i { flex: 1; }
        .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; width: 236px; }
        .sw { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
        .sw.on { border-color: #fff; }
        .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 0.84rem; }
        .set-row .muted { font-size: 0.74rem; }
        .paper-presets { display: flex; gap: 5px; flex-wrap: wrap; }
        .paper-presets button { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line-2); cursor: pointer; }
        .paper-presets button.on { border-color: var(--accent); }
        input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid var(--line-2); border-radius: 8px; background: none; cursor: pointer; }
        .menu { display: flex; flex-direction: column; gap: 4px; min-width: 240px; }
        .menu button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); color: var(--text); font: inherit; font-size: 0.84rem; font-weight: 600; cursor: pointer; text-align: left; }
        .menu button:hover:not(:disabled) { border-color: var(--accent); }
        .menu button:disabled { opacity: 0.4; cursor: not-allowed; }
        .menu button small { color: var(--muted); font-weight: 400; font-size: 0.72rem; }

        /* ---------- Layers dock (right) ---------- */
        .dock { position: absolute; right: 10px; top: 70px; z-index: 12; width: 244px; padding: 10px; max-height: calc(100% - 290px); min-height: 160px; display: flex; flex-direction: column; gap: 8px; }
        .dock-head { display: flex; align-items: center; justify-content: space-between; }
        .dock-head h3 { margin: 0; font-size: 0.86rem; }
        .layer-list { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
        .lrow { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 9px; border: 1px solid transparent; background: var(--bg-2); cursor: pointer; }
        .lrow.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg-2)); }
        .lrow .ln { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
        .lrow .ln small { display: block; color: var(--muted); font-size: 0.66rem; font-weight: 400; }
        .lrow input { width: 100%; padding: 3px 5px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); color: var(--text); font: inherit; font-size: 0.8rem; }
        .ib { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
        .ib:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
        .ib:disabled { opacity: 0.35; cursor: not-allowed; }
        .ib.off { opacity: 0.4; }
        .dock-foot { display: flex; gap: 2px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 6px; }
        .dock .cc { width: 100%; }

        #cursor { position: absolute; pointer-events: none; border: 1.5px solid #fff; mix-blend-mode: difference; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; display: none; }
        .zoom-chip { position: absolute; right: 12px; bottom: 12px; z-index: 10; display: flex; gap: 6px; align-items: center; }
        .zoom-chip .chip { min-width: 70px; justify-content: center; cursor: pointer; }
        .minimap { position: absolute; right: 12px; bottom: 58px; z-index: 10; padding: 6px; border-radius: 12px; }
        .minimap canvas { display: block; width: 200px; height: 130px; border-radius: 8px; cursor: pointer; touch-action: none; }
        .minimap.hidden canvas { display: none; }
        .minimap .mm-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 2px 4px; }
        .minimap .mm-head button { padding: 1px 7px; font-size: 0.7rem; }
        .loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 60; color: var(--muted); font-size: 0.9rem; background: var(--bg); }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; text-align: left; }
        .world { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .world:hover { border-color: var(--accent); }
        .world.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .world .thumb { width: 100%; aspect-ratio: 16 / 10; display: block; object-fit: cover; background: #111; }
        .world .meta { padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .world .meta b { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .world .meta small { color: var(--muted); font-size: 0.7rem; white-space: nowrap; }
        .world .ops { display: flex; gap: 4px; padding: 0 10px 10px; flex-wrap: wrap; }
        .new-row { display: flex; gap: 8px; margin-top: 12px; }
        .new-row input { flex: 1; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); font: inherit; }
        .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 18px; text-align: left; margin-top: 12px; font-size: 0.84rem; }
        .keys div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
        .keys div span:first-child { color: var(--muted); }
        .text-entry { position: absolute; z-index: 20; min-width: 60px; background: rgba(15, 23, 42, 0.35); border: 1px dashed var(--accent); padding: 0; margin: 0; outline: none; resize: none; overflow: hidden; line-height: 1.2; white-space: pre; }

        @media (max-width: 720px) {
            .topbar .stats .chip:not(.accent) { display: none; }
            .topbar { padding: 6px 10px; gap: 6px; }
            .rail { width: 46px; left: 6px; top: 6px; }
            .rbtn { width: 36px; height: 36px; }
            .vs-track { height: 76px; }
            .ctxbar { left: 58px; top: 6px; max-width: calc(100% - 64px); }
            .dock { top: 64px; right: 6px; width: 220px; }
            .minimap canvas { width: 140px; height: 92px; }
            .brush-grid { grid-template-columns: repeat(2, 132px); }
            .timeline { left: 58px; right: 6px; bottom: 54px; }
        }
    </style>
</head>
<body class="no-scroll no-select">
    <header class="topbar">
        <a class="btn ghost sm hub-link" href="../GameIndex.html">Hub</a>
        <h1 class="title">Infinite Ink</h1>
        <div class="stats">
            <span class="chip accent">Canvas <b id="worldName">-</b></span>
            <span class="chip">Strokes <b id="strokeCount">0</b></span>
            <span class="chip hide-sm" title="Position of the view centre">Pos <b id="posVal">0, 0</b></span>
        </div>
        <div class="actions">
            <button class="btn sm icon" id="undoBtn" title="Undo (Ctrl+Z · two-finger tap)" data-icon="undo"></button>
            <button class="btn sm icon" id="redoBtn" title="Redo (Ctrl+Shift+Z · three-finger tap)" data-icon="redo"></button>
            <button class="btn sm" id="settingsBtn" title="Paper, symmetry and input settings">Canvas</button>
            <button class="btn sm" id="galleryBtn">Gallery</button>
            <button class="btn sm" id="animBtn" title="Frame-by-frame animation with onion skinning">Animate</button>
            <button class="btn sm" id="exportBtn">Export</button>
            <button class="btn sm ghost icon" id="helpBtn" title="Keyboard shortcuts (?)">?</button>
        </div>
    </header>

    <main class="studio" id="studio">
        <canvas id="paper"></canvas>
        <canvas id="live"></canvas>
        <canvas id="ui"></canvas>
        <div id="cursor"></div>

        <nav class="rail glass" id="rail" aria-label="Tools">
            <div id="railTools" style="display:contents"></div>
            <div class="rail-sep"></div>
            <button class="well" id="colorWell" title="Colour"><i></i></button>
            <div class="vslider" id="sizeSlider" title="Size ( [ and ] )"><span class="vs-cap">Size</span><div class="vs-track"><div class="vs-fill"></div><div class="vs-thumb"></div></div><b class="vs-val"></b></div>
            <div class="vslider" id="opSlider" title="Opacity"><span class="vs-cap">Opac</span><div class="vs-track"><div class="vs-fill"></div><div class="vs-thumb"></div></div><b class="vs-val"></b></div>
            <div class="rail-sep"></div>
            <button class="rbtn" id="layersBtn" title="Layers" data-icon="layers"></button>
        </nav>

        <div class="ctxbar glass" id="ctxbar"></div>

        <div class="pop glass" id="brushPop" hidden></div>
        <div class="pop glass" id="shapePop" hidden></div>
        <div class="pop glass" id="colorPop" hidden>
            <div class="sv" id="sv"><canvas id="svCv"></canvas><div class="knob" id="svKnob"></div></div>
            <div class="hue" id="hue"><canvas id="hueCv"></canvas><div class="knob" id="hueKnob"></div></div>
            <div class="cp-row">
                <div class="cp-prev" title="Before / now"><i id="cpOld"></i><i id="cpNew"></i></div>
                <input type="text" id="hexIn" maxlength="7" spellcheck="false" aria-label="Hex colour">
                <button class="ib" id="cpPick" title="Pick a colour from the canvas (I)" data-icon="picker"></button>
            </div>
            <h4>Palette</h4>
            <div class="swatches" id="swatches"></div>
            <h4 id="recentLbl">Recent</h4>
            <div class="swatches" id="recentSw"></div>
        </div>
        <div class="pop glass" id="settingsPop" hidden></div>
        <div class="pop glass" id="exportPop" hidden></div>

        <aside class="dock glass" id="layersDock" hidden>
            <div class="dock-head"><h3>Layers</h3><button class="ib" id="layersClose" title="Close">✕</button></div>
            <div class="layer-list" id="layerList"></div>
            <div class="cc"><div class="cl"><span>Layer opacity</span><b id="lopVal">100%</b></div><input type="range" id="lop" min="0" max="100" value="100"></div>
            <div class="dock-foot">
                <button class="ib" id="lAdd" title="New layer" data-icon="plus"></button>
                <button class="ib" id="lUp" title="Move layer up" data-icon="up"></button>
                <button class="ib" id="lDown" title="Move layer down" data-icon="down"></button>
                <button class="ib" id="lMerge" title="Merge into the layer below" data-icon="merge"></button>
                <button class="ib" id="lDel" title="Delete layer" data-icon="trash"></button>
            </div>
        </aside>

        <div class="timeline glass" id="timeline" hidden>
            <button class="ib" id="tlPrev" title="Previous frame ( , )">◀</button>
            <div class="tl-frames" id="tlFrames"></div>
            <button class="ib" id="tlNext" title="Next frame ( . )">▶</button>
            <div class="ctx-sep"></div>
            <button class="ctog" id="tlAdd" title="New blank frame after this one">+ Frame</button>
            <button class="ctog" id="tlDup" title="Copy this frame into a new one">Duplicate</button>
            <button class="ctog danger" id="tlDel" title="Delete this frame">Delete</button>
            <div class="ctx-sep"></div>
            <button class="ctog" id="tlPlay">Play</button>
            <label class="cc"><div class="cl"><span>Speed</span><b id="tlFpsV">8 fps</b></div><input type="range" id="tlFps" min="1" max="30" value="8"></label>
            <button class="ctog" id="tlOnion" title="See the previous (red) and next (green) frames faintly">Onion skin</button>
            <button class="ctog" id="tlAll" title="New strokes appear on every frame (a background)">Draw on all frames</button>
            <button class="ib" id="tlClose" title="Close the timeline">✕</button>
        </div>

        <div class="minimap glass" id="minimap">
            <div class="mm-head"><span>Map</span><button class="btn ghost sm" id="mmToggle" title="Hide map (M)">–</button></div>
            <canvas id="mm" width="400" height="260"></canvas>
        </div>

        <div class="zoom-chip">
            <button class="btn sm" id="zoomOut" title="Zoom out (-)">−</button>
            <span class="chip" id="zoomChip" title="Reset to 100%"><b id="zoomVal">100%</b></span>
            <button class="btn sm" id="zoomIn" title="Zoom in (+)">+</button>
            <button class="btn sm" id="fitBtn" title="Fit drawing (F)">⤢</button>
            <button class="btn sm" id="homeBtn" title="Back to origin (0)">⌂</button>
        </div>

        <div class="overlay" id="galleryOv" hidden>
            <div class="modal wide">
                <h2>Gallery</h2>
                <p>Every canvas is infinite and saved automatically in this browser.</p>
                <div class="new-row">

        /* ---------- Layers ---------- */

                else {

                    const xs = [0, w * c, -h * sn, w * c - h * sn], ys = [0, w * sn, h * c, w * sn + h * c];
                    b = { x0: ax + Math.min(...xs), y0: ay + Math.min(...ys), x1: ax + Math.max(...xs), y1: ay + Math.max(...ys) };
                }
