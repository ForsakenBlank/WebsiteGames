<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship · Arcade</title>
    <link rel="stylesheet" href="../_shared/arcade.css">
    <style>
        :root { --accent: #0ea5e9; --accent-2: #38bdf8; --accent-ink: #021624; --c: min(4.2vw, 4.4vh, 38px); }
        body.no-scroll { overflow: auto; }
        .stage { justify-content: flex-start; overflow: auto; }
        .tbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .boards { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
        .side { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .side h3 { margin: 0; font-size: 0.95rem; }
        .side h3 small { color: var(--muted); font-weight: 500; }
        .board { display: grid; grid-template-columns: repeat(10, var(--c)); grid-template-rows: repeat(10, var(--c)); gap: 2px; padding: 6px; border-radius: 14px; background: linear-gradient(160deg, #0c4a6e, #082f49); border: 1px solid var(--line-2); box-shadow: var(--shadow); position: relative; }
        .cell { border: 0; border-radius: 4px; background: rgba(125, 211, 252, 0.12); padding: 0; cursor: default; display: grid; place-items: center; font-size: calc(var(--c) * 0.5); color: #fff; position: relative; }
        .enemy .cell.open { cursor: crosshair; }
        .enemy .cell.open:hover { background: rgba(250, 204, 21, 0.35); }
        .cell.ship { background: #64748b; }
        .cell.ship.h0 { border-radius: 10px 3px 3px 10px; } .cell.ship.h1 { border-radius: 3px 10px 10px 3px; }
        .cell.ship.v0 { border-radius: 10px 10px 3px 3px; } .cell.ship.v1 { border-radius: 3px 3px 10px 10px; }
        .cell.miss::after { content: ''; width: 26%; height: 26%; border-radius: 50%; background: rgba(226, 232, 240, 0.7); }
        .cell.hit { background: #b91c1c; }
        .cell.hit::after { content: '🔥'; }
        .cell.sunk { background: #450a0a; }
        .cell.sunk::after { content: '✕'; color: #fca5a5; font-weight: 900; }
        .cell.preview { background: rgba(34, 197, 94, 0.55); }
        .cell.bad { background: rgba(239, 68, 68, 0.55); }
        .cell.last { box-shadow: 0 0 0 2px #facc15 inset; }
        .cell.heat { background: rgba(250, 204, 21, var(--h)); }
        .fleet { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(var(--c) * 10 + 40px); }
        .fleet .btn.done { opacity: 0.45; text-decoration: line-through; }
        .fleet .tag { padding: 3px 8px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line); font-size: 0.72rem; }
        .fleet .tag.sunk { text-decoration: line-through; color: var(--bad); }
        .msg { min-height: 1.4em; font-weight: 700; text-align: center; }
        .board.shake { animation: shake 0.3s; }
    </style>
</head>
<body class="no-scroll no-select">
    <header class="topbar">
        <a class="btn ghost sm hub-link" href="../GameIndex.html">Hub</a>
        <h1 class="title">Battleship</h1>
        <div class="stats">
            <span class="chip accent">Wins <b id="wins">0</b></span>
            <span class="chip">Played <b id="played">0</b></span>
            <span class="chip hide-sm">Accuracy <b id="acc">—</b></span>
        </div>
        <div class="actions"><button class="btn sm icon" data-mute>🔊</button></div>
    </header>
    <main class="stage">
        <div class="tbar" id="setupBar">
            <div class="seg" id="diffSeg"><button class="btn sm" data-v="easy">Easy</button><button class="btn sm" data-v="normal">Normal</button><button class="btn sm" data-v="hard">Hard</button></div>
            <button class="btn sm" id="rotBtn">⟳ Rotate (R)</button>
            <button class="btn sm" id="randBtn">🎲 Random</button>
            <button class="btn sm" id="clearBtn">Clear</button>
            <button class="btn sm primary" id="goBtn" disabled>Start battle ⚓</button>
        </div>
        <div class="tbar" id="battleBar" hidden>
            <button class="btn sm" id="newBtn">⟲ New game</button>
            <button class="btn sm" id="heatBtn" title="Show where the hard AI thinks your ships are">🔥 AI heat-map</button>
        </div>
        <div class="msg" id="msg">Place your fleet: pick a ship, then click your board.</div>
        <div class="boards">
            <div class="side">
                <h3>Your fleet <small id="youLeft"></small></h3>
                <div class="board" id="me"></div>
                <div class="fleet" id="fleetPick"></div>
            </div>
            <div class="side" id="enemySide">
                <h3>Enemy waters <small id="themLeft"></small></h3>
                <div class="board enemy" id="them"></div>
                <div class="fleet" id="themFleet"></div>
            </div>
        </div>
        <div class="overlay fixed" id="endOv" hidden>
            <div class="modal">
                <h2 id="endTitle">Victory!</h2>
                <p id="endText"></p>
                <div class="actions"><button class="btn primary lg" id="againBtn">Play again</button></div>
            </div>
        </div>
    </main>
    <script src="../_shared/arcade.js"></script>
    <script>
    (() => {
        'use strict';
        const $ = (id) => document.getElementById(id);
        const N = 10;
        const SHIPS = [['Carrier', 5], ['Battleship', 4], ['Cruiser', 3], ['Submarine', 3], ['Destroyer', 2]];
        const cfg = Object.assign({ diff: 'normal' }, Arcade.load('arcade.battleship.cfg', {}));
        cfg.bonus = true; // a hit always earns another shot
        const stats = Object.assign({ wins: 0, played: 0, shots: 0, hits: 0 }, Arcade.load('arcade.battleship.stats', {}));
        let me, them, phase, sel, horiz = true, hoverCell = -1, turn, lastShot = { me: -1, them: -1 }, showHeat = false, aiBusy = false;

        const blank = () => ({ ships: [], occ: new Int8Array(N * N).fill(-1), shots: new Uint8Array(N * N) });
        function cellsFor(start, len, h) { const x = start % N, y = (start / N) | 0, out = []; for (let k = 0; k < len; k++) { const cx = h ? x + k : x, cy = h ? y : y + k; if (cx >= N || cy >= N) return null; out.push(cy * N + cx); } return out; }
        function fits(b, cells) { return cells && cells.every(v => b.occ[v] < 0); }
        function place(b, idx, cells, h) { b.ships[idx] = { name: SHIPS[idx][0], len: SHIPS[idx][1], cells, h, hits: 0, sunk: false }; for (const v of cells) b.occ[v] = idx; }
        function unplace(b, idx) { const s = b.ships[idx]; if (!s) return; for (const v of s.cells) b.occ[v] = -1; b.ships[idx] = null; }
        function randomFleet(b) {
            for (let i = 0; i < SHIPS.length; i++) {
                if (b.ships[i]) continue;
                for (let t = 0; t < 500; t++) { const h = Math.random() < 0.5, cells = cellsFor(Arcade.randi(0, N * N - 1), SHIPS[i][1], h); if (fits(b, cells)) { place(b, i, cells, h); break; } }
            }
        }
        function newGame() {
            me = blank(); them = blank();
            randomFleet(them);
            phase = 'place'; sel = 0; turn = 'me'; lastShot = { me: -1, them: -1 }; aiBusy = false;
            $('setupBar').hidden = false; $('battleBar').hidden = true;
            say('Place your fleet: pick a ship, then click your board. R rotates.');
            render();
        }
        function say(s, cls) { const m = $('msg'); m.textContent = s; m.className = 'msg ' + (cls || ''); }

        /* ---------- shooting ---------- */
        function fire(b, v) {
            b.shots[v] = 1;
            const i = b.occ[v];
            if (i < 0) return { hit: false };
            const s = b.ships[i]; s.hits++;
            if (s.hits === s.len) { s.sunk = true; return { hit: true, sunk: s }; }
            return { hit: true };
        }
        const allSunk = (b) => b.ships.every(s => s && s.sunk);
        function playerShot(v) {
            if (phase !== 'battle' || turn !== 'me' || them.shots[v]) return;
            const r = fire(them, v);
            lastShot.them = v;
            stats.shots++; if (r.hit) stats.hits++;
            if (r.sunk) { Arcade.sfx('boom'); say(`💥 You sank their ${r.sunk.name}!`, 'good'); }
            else if (r.hit) { Arcade.sfx('hit'); say('🔥 Hit!', 'good'); }
            else { Arcade.tone(200, 0.12, 'sine', 0.05, 90); say('Splash — a miss.'); }
            if (allSunk(them)) return end(true);
            if (!(r.hit && cfg.bonus)) { turn = 'ai'; setTimeout(aiTurn, 650); }
            render();
        }
        function aiTurn() {
            if (phase !== 'battle') return;
            const v = aiPick();
            const r = fire(me, v);
            lastShot.me = v;
            if (r.sunk) { Arcade.sfx('boom'); say(`They sank your ${r.sunk.name}!`, 'bad'); $('me').classList.add('shake'); setTimeout(() => $('me').classList.remove('shake'), 300); }
            else if (r.hit) { Arcade.sfx('bad'); say('They hit your ' + me.ships[me.occ[v]].name + '!', 'bad'); }
            else say('They missed. Your turn!');
            if (allSunk(me)) return end(false);
            if (r.hit && cfg.bonus) { render(); setTimeout(aiTurn, 650); return; }
            turn = 'me';
            render();
        }
        // unresolved hits: hit cells whose ship isn't sunk yet
        const openHits = (b) => { const out = []; for (let v = 0; v < N * N; v++) if (b.shots[v] && b.occ[v] >= 0 && !b.ships[b.occ[v]].sunk) out.push(v); return out; };
        const nb = (v) => { const x = v % N, y = (v / N) | 0, o = []; if (x > 0) o.push(v - 1); if (x < N - 1) o.push(v + 1); if (y > 0) o.push(v - N); if (y < N - 1) o.push(v + N); return o; };
        function heat(b) {
            const H = new Float64Array(N * N), hits = openHits(b), hitSet = new Set(hits);
            const blocked = (v) => b.shots[v] && !(hitSet.has(v));
            for (const s of b.ships) {
                if (s.sunk) continue;
                for (let st = 0; st < N * N; st++) for (const h of [true, false]) {
                    const cells = cellsFor(st, s.len, h);
                    if (!cells || cells.some(blocked)) continue;
                    const cover = cells.filter(v => hitSet.has(v)).length;
                    if (hits.length && !cover) continue;
                    const w = cover ? Math.pow(30, cover) : 1;
                    for (const v of cells) if (!b.shots[v]) H[v] += w;
                }
            }
            return H;
        }
        function aiPick() {
            const free = []; for (let v = 0; v < N * N; v++) if (!me.shots[v]) free.push(v);
            if (cfg.diff === 'easy') {
                const hits = openHits(me);
                if (hits.length && Math.random() < 0.5) { const cand = hits.flatMap(nb).filter(v => !me.shots[v]); if (cand.length) return Arcade.pick(cand); }
                return Arcade.pick(free);
            }
            if (cfg.diff === 'normal') {
                const hits = openHits(me);
                if (hits.length) {
                    // follow a line if two hits are in a row
                    let cand = [];
                    for (const a of hits) for (const b2 of hits) if (a !== b2 && nb(a).includes(b2)) { const d = b2 - a, nx = b2 + d; if (nx >= 0 && nx < N * N && !me.shots[nx] && (Math.abs(d) === N || ((nx / N) | 0) === ((b2 / N) | 0))) cand.push(nx); }
                    if (!cand.length) cand = hits.flatMap(nb).filter(v => !me.shots[v]);
                    if (cand.length) return Arcade.pick(cand);
                }
                const par = free.filter(v => ((v % N) + ((v / N) | 0)) % 2 === 0);
                return Arcade.pick(par.length ? par : free);
            }
            const H = heat(me);
            let best = -1, bv = free[0];
            for (const v of free) { const h = H[v] + Math.random() * 0.01; if (h > best) { best = h; bv = v; } }
            return bv;
        }
        function end(won) {
            phase = 'over';
            stats.played++;
            if (won) { stats.wins++; Arcade.count('win'); Arcade.addXP(cfg.diff === 'hard' ? 40 : cfg.diff === 'normal' ? 25 : 12, true); }
            Arcade.save('arcade.battleship.stats', stats);
            Arcade.sfx(won ? 'win' : 'die');
            const shots = them.shots.reduce((a, b) => a + b, 0), hits = them.ships.reduce((a, s) => a + s.hits, 0);
            $('endTitle').textContent = won ? '⚓ Victory!' : '🌊 Your fleet was sunk';
            $('endTitle').className = won ? 'good' : 'bad';
            $('endText').textContent = `${shots} shots, ${hits} hits (${Math.round(hits / Math.max(1, shots) * 100)}% accuracy) on ${cfg.diff}. ` + (won ? '' : 'Their ships are now shown.');
            render();
            setTimeout(() => Arcade.show('endOv'), 600);
        }

        /* ---------- render ---------- */
        function shipClass(b, v) {
            const i = b.occ[v]; if (i < 0) return '';
            const s = b.ships[i], k = s.cells.indexOf(v), dir = s.h ? 'h' : 'v';
            return ' ship' + (k === 0 ? ' ' + dir + '0' : k === s.len - 1 ? ' ' + dir + '1' : '');
        }
        function render() {
            const meEl = $('me'), themEl = $('them');
            const pv = new Set(), bad = phase === 'place' && sel >= 0 && hoverCell >= 0 && !fits(me, cellsFor(hoverCell, SHIPS[sel][1], horiz));
            if (phase === 'place' && sel >= 0 && hoverCell >= 0) { const cells = cellsFor(hoverCell, SHIPS[sel][1], horiz); if (cells) cells.forEach(v => pv.add(v)); else pv.add(hoverCell); }
            const H = showHeat && phase === 'battle' ? heat(me) : null, hmax = H ? Math.max(...H) || 1 : 1;
            if (meEl.children.length !== N * N) {
                for (let v = 0; v < N * N; v++) for (const el of [meEl, themEl]) { const c = document.createElement('button'); c.dataset.v = v; el.appendChild(c); }
            }
            for (let v = 0; v < N * N; v++) {
                const a = meEl.children[v];
                let cls = shipClass(me, v);
                if (me.shots[v]) cls += me.occ[v] >= 0 ? (me.ships[me.occ[v]].sunk ? ' sunk' : ' hit') : ' miss';
                if (pv.has(v)) cls += bad ? ' bad' : ' preview';
                if (v === lastShot.me) cls += ' last';
                if (H && !me.shots[v] && H[v] > 0) { cls += ' heat'; a.style.setProperty('--h', (H[v] / hmax * 0.75).toFixed(2)); }
                a.className = 'cell' + cls;
                const b = themEl.children[v];
                let tc = '';
                const reveal = phase === 'over' || (them.occ[v] >= 0 && them.ships[them.occ[v]].sunk);
                if (reveal) tc += shipClass(them, v);
                if (them.shots[v]) tc += them.occ[v] >= 0 ? (them.ships[them.occ[v]].sunk ? ' sunk' : ' hit') : ' miss';
                else if (phase === 'battle' && turn === 'me') tc += ' open';
                if (v === lastShot.them) tc += ' last';
                b.className = 'cell' + tc;
            }
            $('enemySide').style.opacity = phase === 'place' ? 0.45 : 1;
            const fp = $('fleetPick'); fp.innerHTML = '';
            SHIPS.forEach(([name, len], i) => {
                if (phase === 'place') {
                    const b = document.createElement('button');
                    b.className = 'btn sm' + (i === sel ? ' primary' : '') + (me.ships[i] ? ' done' : '');
                    b.textContent = name + ' ' + '▮'.repeat(len);
                    b.onclick = () => { sel = i; if (me.ships[i]) unplace(me, i); render(); };
                    fp.appendChild(b);
                } else fp.insertAdjacentHTML('beforeend', `<span class="tag${me.ships[i].sunk ? ' sunk' : ''}">${name} ${len}</span>`);
            });
            const tf = $('themFleet'); tf.innerHTML = '';
            them.ships.forEach(s => tf.insertAdjacentHTML('beforeend', `<span class="tag${s.sunk ? ' sunk' : ''}">${s.name} ${s.len}</span>`));
            $('goBtn').disabled = !me.ships.filter(Boolean).length || me.ships.filter(Boolean).length < SHIPS.length;
            $('youLeft').textContent = phase === 'place' ? '' : `· ${me.ships.filter(s => !s.sunk).length} afloat`;
            $('themLeft').textContent = `· ${them.ships.filter(s => !s.sunk).length} afloat`;
            Arcade.text('wins', stats.wins); Arcade.text('played', stats.played);
            Arcade.text('acc', stats.shots ? Math.round(stats.hits / stats.shots * 100) + '%' : '—');
            document.querySelectorAll('#diffSeg [data-v]').forEach(b => b.classList.toggle('active', b.dataset.v === cfg.diff));
            $('heatBtn').classList.toggle('primary', showHeat);
        }
        $('me').addEventListener('pointerover', (e) => { const v = e.target.dataset && e.target.dataset.v; if (v !== undefined && phase === 'place' && hoverCell !== +v) { hoverCell = +v; render(); } });
        $('me').addEventListener('pointerleave', () => { if (hoverCell < 0) return; hoverCell = -1; if (phase === 'place') render(); });
        $('me').addEventListener('click', (e) => {
            if (phase !== 'place') return;
            const v = +e.target.dataset.v; if (isNaN(v)) return;
            const i = me.occ[v];
            if (i >= 0) { unplace(me, i); sel = i; horiz = true; render(); return; }
            if (sel < 0) return;
            const cells = cellsFor(v, SHIPS[sel][1], horiz);
            if (!fits(me, cells)) { Arcade.sfx('bad'); return; }
            place(me, sel, cells, horiz); Arcade.sfx('select');
            sel = SHIPS.findIndex((_, k) => !me.ships[k]);
            render();
        });
        $('them').addEventListener('click', (e) => { const v = +e.target.dataset.v; if (!isNaN(v)) playerShot(v); });
        const rotate = () => { horiz = !horiz; render(); };
        $('rotBtn').onclick = rotate;
        window.addEventListener('keydown', (e) => { if (e.code === 'KeyR' && phase === 'place') rotate(); });
        $('randBtn').onclick = () => { me = blank(); randomFleet(me); sel = -1; render(); };
        $('clearBtn').onclick = () => { me = blank(); sel = 0; render(); };
        $('goBtn').onclick = () => {
            phase = 'battle'; turn = Math.random() < 0.5 ? 'me' : 'ai';
            $('setupBar').hidden = true; $('battleBar').hidden = false;
            say(turn === 'me' ? 'Battle stations! You fire first — click enemy waters.' : 'The enemy fires first…');
            render();
            if (turn === 'ai') setTimeout(aiTurn, 900);
        };
        document.querySelectorAll('#diffSeg [data-v]').forEach(b => b.onclick = () => { cfg.diff = b.dataset.v; Arcade.save('arcade.battleship.cfg', cfg); render(); });
        $('heatBtn').onclick = () => { showHeat = !showHeat; render(); };
        // in-page replacement for confirm(): browsers can permanently suppress confirm() dialogs, which made buttons silently do nothing
        let _armed = null;
        function sureTwice(msg) {
            if (_armed === msg) { _armed = null; return true; }
            _armed = msg; Arcade.toast(msg + ' Click again to confirm.', '', 2500);
            setTimeout(() => { if (_armed === msg) _armed = null; }, 3000);
            return false;
        }
        $('newBtn').onclick = () => { if (phase === 'battle' && !sureTwice('Abandon this battle?')) return; newGame(); };
        $('againBtn').onclick = () => { Arcade.hide('endOv'); newGame(); };
        newGame();
        window.__bs = { get me() { return me; }, get them() { return them; }, playerShot, get phase() { return phase; }, get turn() { return turn; }, cfg, start: () => { $('randBtn').click(); $('goBtn').click(); } };
    })();
    </script>
</body>
</html>
