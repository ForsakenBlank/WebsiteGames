<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RPG: Village & Mines</title>
    <style>
        body { background: #121212; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; user-select: none; }
        #game-container { position: relative; border: 4px solid #333; margin-top: 10px; }
        canvas { display: block; background: #000; image-rendering: pixelated; }
        
        #ui-wrapper { width: 900px; display: grid; grid-template-columns: 1fr 300px; gap: 10px; margin-top: 10px; }
        .panel { background: #222; border: 2px solid #444; padding: 15px; border-radius: 8px; }
        
        .inventory-grid { display: grid; grid-template-columns: repeat(5, 50px); gap: 5px; margin-top: 10px; min-height: 110px; }
        .slot { width: 50px; height: 50px; background: #333; border: 1px solid #555; display: flex; align-items: center; justify-content: center; font-size: 10px; position: relative; }
        .item-icon { width: 40px; height: 40px; cursor: grab; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 4px; font-weight: bold; }
        
        .equip-area { display: flex; gap: 10px; margin-bottom: 10px; }
        .equip-slot { border: 2px dashed #666; width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; font-size: 9px; }
        
        /* Modal for Blacksmith */
        #shop-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #333; padding: 20px; border: 3px solid #f1c40f; z-index: 100; border-radius: 10px; }
        .recipe-btn { display: block; width: 100%; margin: 5px 0; padding: 8px; background: #444; color: #fff; border: 1px solid #666; cursor: pointer; }
        .recipe-btn:hover { background: #555; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>
</div>

<div id="ui-wrapper">
    <div class="panel">
        <div style="display:flex; justify-content: space-between;">
            <div><strong>HP:</strong> <span id="hp-val">100</span> | <strong>Gold:</strong> <span id="gold-val">0</span></div>
            <div><strong>ATK:</strong> <span id="atk-val">10</span> | <strong>DEF:</strong> <span id="def-val">0</span></div>
        </div>
        <h4>Equipment</h4>
        <div class="equip-area">
            <div class="slot equip-slot" id="armor-slot" ondrop="drop(event)" ondragover="allowDrop(event)">ARMOR</div>
            <div id="acc-container" style="display:flex; gap:5px;"></div>
        </div>
        <h4>Backpack</h4>
        <div class="inventory-grid" id="inventory" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>
    <div class="panel">
        <h4>Game Log</h4>
        <div id="game-log" style="height: 180px; overflow-y: auto; font-size: 13px; color: #aaa;"></div>
    </div>
</div>

<div id="shop-modal">
    <h3 style="color:#f1c40f">Blacksmith's Forge</h3>
    <div id="recipes">
        <button class="recipe-btn" onclick="craft('Iron Armor', 10, 50)">Iron Armor (10 Ore, 50G)</button>
        <button class="recipe-btn" onclick="craft('Speed Ring', 5, 100)">Speed Ring (5 Gem, 100G)</button>
        <button class="recipe-btn" onclick="craft('Power Charm', 5, 75)">Power Charm (5 Stone, 75G)</button>
    </div>
    <button onclick="document.getElementById('shop-modal').style.display='none'" style="margin-top:10px; width:100%; background:#c0392b; color:white; border:none; padding:5px;">Close</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const player = {
    x: 450, y: 400, size: 24, speed: 4, baseSpeed: 4,
    hp: 100, gold: 50, atk: 10, def: 0,
    inventory: [], equips: { armor: null, accessories: [] },
    accSlots: 1, room: 'village'
};

const items = {
    'Stone': { color: '#7f8c8d' }, 'Iron Ore': { color: '#bdc3c7' }, 'Gem': { color: '#3498db' },
    'Iron Armor': { type: 'armor', def: 15, color: '#95a5a6' },
    'Speed Ring': { type: 'acc', speed: 2, color: '#f1c40f' },
    'Power Charm': { type: 'acc', atk: 20, color: '#e67e22' }
};

let enemies = [];
let resources = [];
let npcs = [{ x: 200, y: 200, name: 'Blacksmith', color: '#e67e22', type: 'shop' }];
const keys = {};

function initMines() {
    resources = [];
    for(let i=0; i<10; i++) {
        resources.push({
            x: Math.random()*800+50, y: Math.random()*300+50,
            type: Math.random() > 0.4 ? 'Stone' : (Math.random() > 0.6 ? 'Iron Ore' : 'Gem'),
            hp: 3, name: 'Deposit'
        });
    }
    enemies = [
        { x: 100, y: 100, hp: 40, name: 'Bat', color: '#c0392b', atk: 5 },
        { x: 700, y: 150, hp: 150, name: 'MINE BOSS', color: '#8e44ad', atk: 15, isBoss: true }
    ];
}

function craft(name, matCost, goldCost) {
    const matType = name === 'Iron Armor' ? 'Iron Ore' : (name === 'Speed Ring' ? 'Gem' : 'Stone');
    const mats = player.inventory.filter(i => i === matType).length;
    
    if (mats >= matCost && player.gold >= goldCost) {
        for(let i=0; i<matCost; i++) player.inventory.splice(player.inventory.indexOf(matType), 1);
        player.gold -= goldCost;
        player.inventory.push(name);
        postLog(`Forged ${name}!`);
        renderInventory();
    } else {
        postLog("Not enough materials or gold!");
    }
}

function handleInteraction() {
    // Village: Blacksmith
    if (player.room === 'village') {
        npcs.forEach(npc => {
            if (Math.hypot(player.x - npc.x, player.y - npc.y) < 50) {
                document.getElementById('shop-modal').style.display = 'block';
            }
        });
    }
    // Mines: Combat & Mining
    if (player.room === 'mines') {
        resources.forEach((res, i) => {
            if (Math.hypot(player.x - res.x, player.y - res.y) < 50) {
                res.hp--;
                postLog("Mining...");
                if (res.hp <= 0) { player.inventory.push(res.type); resources.splice(i, 1); postLog(`Mined ${res.type}!`); }
            }
        });
        enemies.forEach((en, i) => {
            if (Math.hypot(player.x - en.x, player.y - en.y) < 60) {
                en.hp -= player.atk;
                player.hp -= Math.max(1, en.atk - player.def);
                if (en.hp <= 0) {
                    player.gold += en.isBoss ? 100 : 15;
                    if(en.isBoss) { player.accSlots++; postLog("Boss Slain! +1 Accessory Slot."); }
                    enemies.splice(i, 1);
                }
            }
        });
    }
    renderInventory();
}

function update() {
    if (keys['w']) player.y -= player.speed;
    if (keys['s']) player.y += player.speed;
    if (keys['a']) player.x -= player.speed;
    if (keys['d']) player.x += player.speed;

    // Room Switch: Top of village goes to Mines
    if (player.room === 'village' && player.y < 10) { player.room = 'mines'; player.y = 470; initMines(); }
    if (player.room === 'mines' && player.y > 480) { player.room = 'village'; player.y = 30; enemies = []; resources = []; }
}

function draw() {
    ctx.fillStyle = player.room === 'village' ? '#2d5a27' : '#1a1a1a';
    ctx.fillRect(0, 0, 900, 500);

    // Draw Portals
    ctx.fillStyle = "#ecf0f1";
    ctx.fillRect(400, 0, 100, 10);
    ctx.fillRect(400, 490, 100, 10);

    // Draw Entities with Labels
    const drawEnt = (e, color) => {
        ctx.fillStyle = color;
        ctx.fillRect(e.x, e.y, 30, 30);
        ctx.fillStyle = "white";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(e.name || e.type, e.x + 15, e.y - 5);
    };

    if (player.room === 'village') npcs.forEach(n => drawEnt(n, n.color));
    if (player.room === 'mines') {
        resources.forEach(r => drawEnt(r, items[r.type].color));
        enemies.forEach(e => drawEnt(e, e.color));
    }

    drawEnt({ x: player.x, y: player.y, name: 'Hero' }, '#3498db');
    update();
    requestAnimationFrame(draw);
}

// Reuse Inventory logic from previous version, just updated for visuals...
function renderInventory() {
    const inv = document.getElementById('inventory'); inv.innerHTML = '';
    player.inventory.forEach((name, i) => {
        const div = document.createElement('div'); div.className = 'slot';
        div.innerHTML = `<div class="item-icon" draggable="true" ondragstart="drag(event)" data-idx="${i}" data-name="${name}" style="background:${items[name].color}">${name[0]}</div>`;
        inv.appendChild(div);
    });
    const accCont = document.getElementById('acc-container'); accCont.innerHTML = '';
    for(let i=0; i<player.accSlots; i++) {
        const slot = document.createElement('div'); slot.className = 'slot acc-slot'; slot.dataset.accidx = i;
        slot.ondrop = drop; slot.ondragover = allowDrop;
        slot.innerHTML = player.equips.accessories[i] ? `<div class="item-icon" style="background:${items[player.equips.accessories[i]].color}">${player.equips.accessories[i][0]}</div>` : 'ACC';
        accCont.appendChild(slot);
    }
    document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(player.hp));
    document.getElementById('gold-val').innerText = player.gold;
    document.getElementById('atk-val').innerText = player.atk;
    document.getElementById('def-val').innerText = player.def;
}

function allowDrop(ev) { ev.preventDefault(); }
function drag(ev) { ev.dataTransfer.setData("text", ev.target.dataset.idx); ev.dataTransfer.setData("name", ev.target.dataset.name); }
function drop(ev) {
    ev.preventDefault();
    const idx = ev.dataTransfer.getData("text");
    const name = ev.dataTransfer.getData("name");
    if (ev.target.id === "armor-slot" && items[name].type === 'armor') { player.equips.armor = name; player.inventory.splice(idx, 1); }
    else if (ev.target.classList.contains('acc-slot') && items[name].type === 'acc') { player.equips.accessories[ev.target.dataset.accidx] = name; player.inventory.splice(idx, 1); }
    calculateStats(); renderInventory();
}
function calculateStats() {
    player.def = (player.equips.armor ? items[player.equips.armor].def : 0);
    player.atk = 10; player.speed = player.baseSpeed;
    player.equips.accessories.forEach(acc => { if(acc) { player.atk += (items[acc].atk || 0); player.speed += (items[acc].speed || 0); }});
}
function postLog(m) { const l = document.getElementById('game-log'); l.innerHTML = `> ${m}<br>` + l.innerHTML; }

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('keypress', e => { if(e.code === 'Space') handleInteraction(); });
renderInventory(); draw();
</script>
</body>
</html>
