<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dots &amp; Boxes · Arcade</title>
    <link rel="stylesheet" href="../_shared/arcade.css">
    <style>
        :root { --accent: #d6476b; --accent-ink: #fff; }
        .stage { justify-content: flex-start; }
        .players { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .pl { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--surface); font-family: var(--display); font-weight: 600; }
        .pl .d { width: 14px; height: 14px; border-radius: 50%; }
        .pl b { font-size: 1.15rem; }
        .pl.turn { box-shadow: inset 0 0 0 3px var(--pc); }
        .paper { width: min(92vw, 560px); aspect-ratio: 1; border-radius: 28px; background: #f4ecdd; padding: 4%; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
        .paper svg { width: 100%; height: 100%; display: block; touch-action: manipulation; }
        .ln { cursor: pointer; }
        .msg { font-family: var(--display); font-weight: 600; font-size: 1.15rem; min-height: 1.5em; text-align: center; }
        .setup { text-align: left; }
        .setup h2 { text-align: center; }
        .lab { display: block; margin: 16px 0 8px; font-family: var(--display); font-weight: 600; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .ch { border: 0; padding: 9px 14px; border-radius: 999px; background: var(--bg-2); color: var(--muted); font-family: var(--display); font-weight: 600; cursor: pointer; }
        .ch.on { background: var(--accent); color: var(--accent-ink); }
        .seats { display: grid; gap: 8px; }
        .seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--bg-2); }
        .seat .d { width: 16px; height: 16px; border-radius: 50%; flex: none; }
        .seat .grow { font-family: var(--display); font-weight: 600; }
    </style>
</head>
<body class="no-select">
    <header class="topbar">
        <a class="btn ghost sm hub-link" href="../GameIndex.html">Hub</a>
        <h1 class="title">Dots &amp; Boxes</h1>
        <div class="stats"><span class="chip accent">Wins <b id="wins">0</b></span></div>
        <div class="actions"><button class="btn icon sm" id="menuBtn" title="New game"></button><button class="btn icon sm" data-mute></button></div>
    </header>
    <main class="stage">
        <div class="players" id="players"></div>
        <div class="msg" id="msg"></div>
        <div class="paper"><svg id="svg"></svg></div>

        <div class="overlay fixed" id="setupOv" hidden>
            <div class="modal setup">
                <h2>Dots &amp; Boxes</h2>
                <p class="small muted" style="text-align:center">Draw one line a turn. Close a box to claim it and go again.</p>
                <label class="lab">Players</label>
                <div class="seats" id="seats"></div>
                <div class="row" style="margin-top:8px"><button class="btn sm" id="addSeat">Add player</button><button class="btn sm ghost" id="remSeat">Remove</button></div>
                <label class="lab">Board</label>
                <div class="chips" id="sizeChips"></div>
                <label class="lab">Computer level</label>
                <div class="chips" id="diffChips"></div>
                <div class="actions"><button class="btn primary lg" id="startBtn">Play</button></div>
            </div>
        </div>
        <div class="overlay fixed" id="endOv" hidden>
            <div class="modal">
                <h2 id="endTitle">You win!</h2>
                <p id="endText"></p>
                <div class="actions"><button class="btn primary lg" id="againBtn">Play again</button><button class="btn lg" id="changeBtn">Change</button></div>
            </div>
        </div>
    </main>
    <script src="../_shared/arcade.js"></script>
    <script>
    (() => {
        'use strict';
        const $ = (id) => document.getElementById(id);
        const COLORS = ['#d6476b', '#2f7fc4', '#2a9d58', '#e08a1f'];
        const NAMES = ['Pink', 'Blue', 'Green', 'Orange'];
        const cfg = Object.assign({ seats: ['human', 'ai'], size: 4, diff: 'normal' }, Arcade.load('arcade.dots.cfg', {}));
        const stats = Object.assign({ wins: 0, played: 0 }, Arcade.load('arcade.dots.stats', {}));
        let R, C, h, v, owner, turn, scores, over, busy = false, lastLine = null;

        /* ---------- board model ---------- */
        // h[r][c]: line above box row r (r = 0..R). v[r][c]: line left of box column c (c = 0..C)
        function reset() {
            R = C = cfg.size;
            h = Array.from({ length: R + 1 }, () => new Array(C).fill(-1));
            v = Array.from({ length: R }, () => new Array(C + 1).fill(-1));
            owner = Array.from({ length: R }, () => new Array(C).fill(-1));
        }
        const sides = (r, c) => (h[r][c] >= 0) + (h[r + 1][c] >= 0) + (v[r][c] >= 0) + (v[r][c + 1] >= 0);
        function boxesOf(line) {
            const [t, r, c] = line, out = [];
            if (t === 'h') { if (r > 0) out.push([r - 1, c]); if (r < R) out.push([r, c]); }
            else { if (c > 0) out.push([r, c - 1]); if (c < C) out.push([r, c]); }
            return out;
        }
        function allFree() {
            const out = [];
            for (let r = 0; r <= R; r++) for (let c = 0; c < C; c++) if (h[r][c] < 0) out.push(['h', r, c]);
            for (let r = 0; r < R; r++) for (let c = 0; c <= C; c++) if (v[r][c] < 0) out.push(['v', r, c]);
            return out;
        }
        const setLine = ([t, r, c], p) => { (t === 'h' ? h : v)[r][c] = p; };
        // draws a line and returns how many boxes it closed
        function apply(line, p) {
            setLine(line, p);
            let closed = 0;
            for (const [r, c] of boxesOf(line)) if (sides(r, c) === 4 && owner[r][c] < 0) { owner[r][c] = p; closed++; }
            return closed;
        }

        /* ---------- computer ---------- */
        const completes = (line) => boxesOf(line).some(([r, c]) => sides(r, c) === 3);
        const givesAway = (line) => boxesOf(line).some(([r, c]) => sides(r, c) === 2);
        // how many boxes the opponent could chain-grab after we play this line
        function chainCost(line) {
            const saveH = h.map(x => x.slice()), saveV = v.map(x => x.slice()), saveO = owner.map(x => x.slice());
            setLine(line, 9);
            let taken = 0, guard = 0;
            while (guard++ < 200) {
                const f = allFree().find(completes);
                if (!f) break;
                taken += apply(f, 9);
            }
            h = saveH; v = saveV; owner = saveO;
            return taken;
        }
        function aiPick() {
            const free = allFree();
            const grab = free.filter(completes);
            const safe = free.filter(l => !completes(l) && !givesAway(l));
            if (cfg.diff === 'easy') {
                if (grab.length && Math.random() < 0.7) return Arcade.pick(grab);
                if (safe.length && Math.random() < 0.6) return Arcade.pick(safe);
                return Arcade.pick(free);
            }
            if (grab.length) {
                // hard: in the endgame, leave the last two boxes of a chain to keep control (the double-cross)
                if (cfg.diff === 'hard' && !safe.length && free.length > 2) {
                    const left = free.filter(l => !completes(l));
                    if (left.length) {
                        const costs = left.map(l => chainCost(l));
                        const chainLen = chainCost(grab[0]) + 1;
                        if (chainLen === 2 && costs.some(x => x >= 3) && grab.length === 1) {
                            const other = boxesOf(grab[0]).find(([r, c]) => sides(r, c) === 2);
                            if (other) {
                                const [r, c] = other;
                                const cand = [['h', r, c], ['h', r + 1, c], ['v', r, c], ['v', r, c + 1]].filter(l => (l[0] === 'h' ? h : v)[l[1]][l[2]] < 0 && !(l[0] === grab[0][0] && l[1] === grab[0][1] && l[2] === grab[0][2]));
                                if (cand.length) return cand[0];
                            }
                        }
                    }
                }
                return Arcade.pick(grab);
            }
            if (safe.length) return Arcade.pick(safe);
            // must give something away: give the smallest chain
            let best = null, bc = Infinity;
            for (const l of free) { const k = chainCost(l); if (k < bc) { bc = k; best = l; } }
            return best || Arcade.pick(free);
        }

        /* ---------- turns ---------- */
        function newGame() {
            reset();
            scores = cfg.seats.map(() => 0);
            turn = 0; over = false; busy = false; lastLine = null;
            draw();
            maybeAI();
        }
        const isAI = (p) => cfg.seats[p] === 'ai';
        function playLine(line) {
            const closed = apply(line, turn);
            lastLine = line;
            if (closed) { scores[turn] += closed; Arcade.tone(660 + scores[turn] * 20, 0.1, 'triangle', 0.09); Arcade.buzz(15); }
            else { Arcade.tone(420, 0.05, 'sine', 0.06); turn = (turn + 1) % cfg.seats.length; }
            if (!allFree().length) { finish(); return; }
            draw();
            maybeAI();
        }
        function maybeAI() {
            if (over || !isAI(turn)) return;
            busy = true;
            draw();
            setTimeout(() => { busy = false; if (!over) playLine(aiPick()); }, 380);
        }
        function clickLine(line) {
            if (over || busy || isAI(turn)) return;
            if ((line[0] === 'h' ? h : v)[line[1]][line[2]] >= 0) return;
            playLine(line);
        }
        function finish() {
            over = true;
            draw();
            const top = Math.max(...scores);
            const winners = scores.map((s, i) => s === top ? i : -1).filter(i => i >= 0);
            const humans = cfg.seats.map((s, i) => s === 'human' ? i : -1).filter(i => i >= 0);
            const vsAI = cfg.seats.includes('ai');
            let title = winners.length > 1 ? "It's a tie!" : NAMES[winners[0]] + ' wins!';
            if (vsAI && humans.length === 1) {
                stats.played++;
                if (winners.length === 1 && winners[0] === humans[0]) { title = 'You win!'; stats.wins++; Arcade.count('win'); Arcade.addXP(cfg.diff === 'hard' ? 40 : cfg.diff === 'normal' ? 20 : 8); Arcade.sfx('win'); }
                else if (!winners.includes(humans[0])) { title = 'The computer wins'; Arcade.sfx('die'); }
                Arcade.save('arcade.dots.stats', stats);
            } else { Arcade.count('round'); Arcade.sfx('win'); }
            $('endTitle').textContent = title;
            $('endText').textContent = scores.map((s, i) => `${NAMES[i]} ${s}`).join(' · ');
            setTimeout(() => Arcade.show('endOv'), 700);
        }

        /* ---------- drawing ---------- */
        function draw() {
            const S = 100, pad = 10, W = C * S + pad * 2, H = R * S + pad * 2;
            const svg = $('svg');
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            let out = '';
            for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
                const o = owner[r][c];
                if (o >= 0) out += `<rect x="${pad + c * S + 8}" y="${pad + r * S + 8}" width="${S - 16}" height="${S - 16}" rx="16" fill="${COLORS[o]}" opacity="0.85"/><text x="${pad + c * S + S / 2}" y="${pad + r * S + S / 2 + 12}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="34" fill="#fff">${NAMES[o][0]}</text>`;
            }
            const lineSvg = (t, r, c, p) => {
                const x1 = pad + c * S, y1 = pad + r * S, x2 = t === 'h' ? x1 + S : x1, y2 = t === 'h' ? y1 : y1 + S;
                const isLast = lastLine && lastLine[0] === t && lastLine[1] === r && lastLine[2] === c;
                const hit = t === 'h' ? `<rect class="ln" data-l="${t},${r},${c}" x="${x1 + 12}" y="${y1 - 22}" width="${S - 24}" height="44" fill="transparent"/>` : `<rect class="ln" data-l="${t},${r},${c}" x="${x1 - 22}" y="${y1 + 12}" width="44" height="${S - 24}" fill="transparent"/>`;
                const ink = p >= 0 ? `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COLORS[p]}" stroke-width="${isLast ? 12 : 9}" stroke-linecap="round"/>` : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ddd2bd" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>`;
                return ink + (p < 0 ? hit : '');
            };
            for (let r = 0; r <= R; r++) for (let c = 0; c < C; c++) out += lineSvg('h', r, c, h[r][c]);
            for (let r = 0; r < R; r++) for (let c = 0; c <= C; c++) out += lineSvg('v', r, c, v[r][c]);
            for (let r = 0; r <= R; r++) for (let c = 0; c <= C; c++) out += `<circle cx="${pad + c * S}" cy="${pad + r * S}" r="9" fill="#3a2c1a"/>`;
            svg.innerHTML = out;
            svg.querySelectorAll('.ln').forEach(e => {
                const [t, r, c] = e.dataset.l.split(',');
                e.addEventListener('click', () => clickLine([t, +r, +c]));
                e.addEventListener('pointerenter', () => { if (!over && !busy && !isAI(turn)) e.setAttribute('fill', COLORS[turn] + '44'); });
                e.addEventListener('pointerleave', () => e.setAttribute('fill', 'transparent'));
            });
            $('players').innerHTML = cfg.seats.map((s, i) => `<div class="pl ${i === turn && !over ? 'turn' : ''}" style="--pc:${COLORS[i]}"><span class="d" style="background:${COLORS[i]}"></span>${NAMES[i]}${s === 'ai' ? ' (cpu)' : ''} <b>${scores[i] || 0}</b></div>`).join('');
            $('msg').textContent = over ? 'Game over' : isAI(turn) ? NAMES[turn] + ' is thinking...' : (cfg.seats.filter(x => x === 'human').length > 1 ? NAMES[turn] + "'s turn" : 'Your turn');
            Arcade.text('wins', stats.wins);
        }

        /* ---------- setup ---------- */
        function chips(host, list, val, set) {
            host.innerHTML = '';
            for (const [k, l] of list) {
                const b = document.createElement('button');
                b.className = 'ch' + (k === val ? ' on' : '');
                b.textContent = l;
                b.onclick = () => { set(k); Arcade.sfx('select'); renderSetup(); };
                host.appendChild(b);
            }
        }
        function renderSetup() {
            const s = $('seats'); s.innerHTML = '';
            cfg.seats.forEach((kind, i) => {
                const row = document.createElement('div');
                row.className = 'seat';
                row.innerHTML = `<span class="d" style="background:${COLORS[i]}"></span><span class="grow">${NAMES[i]}</span>`;
                const t = document.createElement('div'); t.className = 'chips';
                chips(t, [['human', 'Person'], ['ai', 'Computer']], kind, v2 => cfg.seats[i] = v2);
                row.appendChild(t);
                s.appendChild(row);
            });
            $('addSeat').disabled = cfg.seats.length >= 4;
            $('remSeat').disabled = cfg.seats.length <= 2;
            chips($('sizeChips'), [[3, '3x3'], [4, '4x4'], [5, '5x5'], [6, '6x6']], cfg.size, v2 => cfg.size = v2);
            chips($('diffChips'), [['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']], cfg.diff, v2 => cfg.diff = v2);
        }
        $('addSeat').onclick = () => { if (cfg.seats.length < 4) cfg.seats.push('human'); renderSetup(); };
        $('remSeat').onclick = () => { if (cfg.seats.length > 2) cfg.seats.pop(); renderSetup(); };
        $('startBtn').onclick = () => {
            if (cfg.seats.every(s => s === 'ai')) cfg.seats[0] = 'human';
            Arcade.save('arcade.dots.cfg', cfg); Arcade.hide('setupOv'); newGame();
        };
        $('menuBtn').innerHTML = Arcade.icon('restart');
        $('menuBtn').onclick = () => { Arcade.hide('endOv'); renderSetup(); Arcade.show('setupOv'); };
        $('againBtn').onclick = () => { Arcade.hide('endOv'); newGame(); };
        $('changeBtn').onclick = () => { Arcade.hide('endOv'); renderSetup(); Arcade.show('setupOv'); };
        reset(); scores = cfg.seats.map(() => 0); turn = 0; over = true;
        draw();
        renderSetup();
        Arcade.show('setupOv');
        window.__dots = { clickLine, allFree, get over() { return over; }, get turn() { return turn; }, get scores() { return scores; } };
    })();
    </script>
</body>
</html>
