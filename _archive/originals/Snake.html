<!DOCTYPE html>
<html>
<head>
    <title>Snake | Midnight Edition</title>
    <style>
        :root {
            --bg: #121417;
            --panel: #1e2126;
            --text: #e0e0e0;
            --accent: #2ecc71;
            --food: #e74c3c;
            --border: #34495e;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; 
        }
        #game-card {
            background: var(--panel);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid var(--border);
        }
        canvas { 
            background: #0d0f12; 
            border-radius: 8px;
            display: block;
            margin-top: 20px;
            border: 2px solid var(--border);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .score-box { font-size: 1.1rem; font-weight: 600; color: #95a5a6; }
        
        .difficulty-bar { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { 
            flex: 1; border: 1px solid var(--border); padding: 10px; border-radius: 8px; 
            cursor: pointer; font-weight: 600; transition: all 0.2s;
            background: #2c3e50; color: #bdc3c7;
        }
        .btn:hover { background: #34495e; }
        .btn.active { background: var(--accent); color: #121417; border-color: var(--accent); }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 20, 23, 0.9); border-radius: 20px;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="game-card" style="position: relative;">
    <div class="header">
        <div class="score-box">Score: <span id="score" style="color:var(--accent)">0</span></div>
        <div class="score-box">Best: <span id="best">0</span></div>
    </div>

    <div class="difficulty-bar">
        <button class="btn active" id="btn-easy" onclick="setDiff('easy')">Easy</button>
        <button class="btn" id="btn-medium" onclick="setDiff('medium')">Medium</button>
        <button class="btn" id="btn-hard" onclick="setDiff('hard')">Hard</button>
    </div>

    <canvas id="snakeCanvas" width="400" height="400"></canvas>

    <div id="overlay">
        <h2 style="margin-bottom: 15px; color: var(--food);">GAME OVER</h2>
        <button class="btn" style="flex:none; width: 160px; background: var(--accent); color: #121417;" onclick="startGame()">RESTART</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');

    const GRID = 20;
    let snake, food, dx, dy, score, best = 0, speed, wallsKill, gameLoop;
    let currentDiff = 'easy';

    function setDiff(diff) {
        currentDiff = diff;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + diff).classList.add('active');
        startGame();
    }

    function startGame() {
        overlay.style.display = 'none';
        if (gameLoop) clearTimeout(gameLoop);
        
        snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        food = {x: 15, y: 15};
        dx = 1; dy = 0;
        score = 0;
        scoreEl.innerText = score;

        // Logic Tweaks
        if (currentDiff === 'easy') { speed = 120; wallsKill = false; }
        if (currentDiff === 'medium') { speed = 120; wallsKill = true; }
        if (currentDiff === 'hard') { speed = 70; wallsKill = true; }

        main();
    }

    function main() {
        if (checkGameOver()) return;
        
        gameLoop = setTimeout(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawFood();
            advanceSnake();
            drawSnake();
            main();
        }, speed);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#2ecc71" : "#27ae60";
            ctx.beginPath();
            ctx.roundRect(part.x * GRID + 1, part.y * GRID + 1, GRID - 2, GRID - 2, index === 0 ? 6 : 4);
            ctx.fill();
        });
    }

    function advanceSnake() {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};

        if (!wallsKill) {
            if (head.x < 0) head.x = 19;
            if (head.x > 19) head.x = 0;
            if (head.y < 0) head.y = 19;
            if (head.y > 19) head.y = 0;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            if (score > best) { best = score; bestEl.innerText = best; }
            spawnFood();
        } else {
            snake.pop();
        }
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * 20);
        food.y = Math.floor(Math.random() * 20);
        if (snake.some(p => p.x === food.x && p.y === food.y)) spawnFood();
    }

    function drawFood() {
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.arc(food.x * GRID + 10, food.y * GRID + 10, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    function checkGameOver() {
        const head = snake[0];
        if (wallsKill && (head.x < 0 || head.x > 19 || head.y < 0 || head.y > 19)) return endGame();
        for (let i = 1; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return endGame();
        }
        return false;
    }

    function endGame() {
        overlay.style.display = 'flex';
        return true;
    }

    window.addEventListener('keydown', e => {
        const keys = {37:'l', 38:'u', 39:'r', 40:'d', 65:'l', 87:'u', 68:'r', 83:'d'};
        const dir = keys[e.keyCode];
        if (!dir) return;
        if (dir === 'l' && dx !== 1) { dx = -1; dy = 0; }
        if (dir === 'u' && dy !== 1) { dx = 0; dy = -1; }
        if (dir === 'r' && dx !== -1) { dx = 1; dy = 0; }
        if (dir === 'd' && dy !== -1) { dx = 0; dy = 1; }
    });

    startGame();
</script>
</body>
</html>
