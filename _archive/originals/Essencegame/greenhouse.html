<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Greenhouse - Farmer Tycoon</title>
    <style>
        :root { --bg: #050a05; --panel: #0d1a0d; --wheat: #fdd835; --corn: #ffeb3b; --soy: #a5d6a7; --potato: #8d6e63; --pumpkin: #ff9800; }
        body { background: var(--bg); color: #e8f5e9; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 200px; background: var(--panel); border-right: 2px solid #1b5e20; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .crop-select { padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; border: 2px solid transparent; filter: grayscale(1); opacity: 0.5; }
        .crop-select.unlocked { filter: grayscale(0); opacity: 1; border-color: #2e7d32; }
        .crop-select.active { background: #1b5e20; border-color: #fff; }

        /* Main Content */
        .main-view { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; }
        .inventory-bar { background: #000; padding: 10px; border-radius: 10px; display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        
        /* Garden Grid */
        .garden { display: grid; grid-template-columns: repeat(auto-fill, 110px); gap: 10px; justify-content: center; margin-bottom: 30px; }
        .plot { width: 110px; height: 110px; background: #2e1a05; border: 2px solid #3d2b1f; border-radius: 10px; cursor: pointer; position: relative; }
        .plot.ready { border-color: #ffca28; box-shadow: 0 0 15px #ffca28; }
        .progress-bar { position: absolute; bottom: 0; left: 0; height: 6px; background: #4caf50; width: 0%; }
        .crop-icon { font-size: 2.5rem; text-align: center; margin-top: 20px; }

        /* Upgrades */
        .upgrade-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .up-card { background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid #2e7d32; }
        button { background: #2e7d32; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="sidebar" id="crop-sidebar">
        <!-- Crops generated by JS -->
    </div>

    <div class="main-view">
        <div class="inventory-bar" id="inv-bar"></div>

        <div class="garden" id="garden-grid"></div>

        <div style="text-align: center; margin-bottom: 30px;">
            <button onclick="expandPlot()" id="expand-btn" style="width: 300px;">Expand Plots (Cost: <span id="p-cost">0</span> <span id="p-type"></span>)</button>
            <button onclick="unlockNewCrop()" id="unlock-crop-btn" style="width: 300px; background: #01579b;">Unlock Next Crop (Cost: <span id="uc-cost">0</span> Essence)</button>
            <button onclick="location.href='index.html'" style="width: 150px; background: #333;">Return</button>
        </div>

        <h3 id="up-title">Wheat Upgrades</h3>
        <div class="upgrade-grid" id="upgrade-grid"></div>


        <!-- Main Upgrade Grid Ends Here -->
        <div class="upgrade-grid" id="upgrade-grid"></div>

        <!-- Rare Harvests & Upgrades Section -->
        <div style="margin-top: 40px; padding: 20px; background: rgba(255, 215, 0, 0.05); border-radius: 15px; border: 1px solid #444; width: 95%;">
            <h3 style="color: #ffd700; margin-top: 0;">✨ Void Research & Rare Harvests</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <!-- Golden Segment -->
                <div class="up-card" style="border-color: #ffd700;">
                    <b style="color: #ffd700;">Golden Stash: <span id="gold-count">0</span></b><br>
                    <small>Selling Value: <span id="gold-val">0</span> Essence</small>
                    <button onclick="sellRare('gold')" style="background: #b8860b;">Sell All</button>
                    <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                    <b>Golden Efficiency (Lvl <span id="ge-lvl">0</span>)</b><br>
                    <small>+25% Gold Sale Value</small>
                    <button id="ge-btn" onclick="buyRareUp('goldEff')">Cost: 10 Golden</button>
                </div>

                <!-- Diamond Segment -->
                <div class="up-card" style="border-color: #00e5ff;">
                    <b style="color: #00e5ff;">Diamond Vault: <span id="diam-count">0</span></b><br>
                    <small>Selling Value: <span id="diam-val">0</span> Essence</small>
                    <button onclick="sellRare('diam')" style="background: #00838f;">Sell All</button>
                    <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                    <b>Diamond Mastery (Lvl <span id="dm-lvl">0</span>)</b><br>
                    <small>Global x1.15 Gain Boost</small>
                    <button id="dm-btn" onclick="buyRareUp('diamMast')">Cost: 5 Diamond</button>
                </div>
            </div>
        </div>

    </div>



    <script src="game.js"></script>
    <script>
        const CROPS = {
            wheat:   { icon: '🌾', time: 100,  cost: 0,    essTier: 1 },
            corn:    { icon: '🌽', time: 300,  cost: 1e22, essTier: 2 },
            soy:     { icon: '🌱', time: 600,  cost: 1e27, essTier: 4 },
            potato:  { icon: '🥔', time: 1200, cost: 1e32, essTier: 8 },
            pumpkin: { icon: '🎃', time: 3600, cost: 1e37, essTier: 15 }
        };


        const UPGRADE_DEFS = {
            wheat: [
                { name: "Wheat Multiplier", desc: (lvl) => `x${1 + lvl} Crop Gain` },
                { name: "Crop Growth", desc: (lvl) => `${10 * lvl}% Speed Boost` },
                { name: "Essence Grains", desc: (lvl) => `+${format((lvl * state.totalGain).toFixed(1))} Essence/Harvest` }
            ],
            corn: [
                { name: "Corn Multiplier", desc: (lvl) => `x${1 + lvl} Crop Gain` },
                { name: "Dusty Corn", desc: (lvl) => `+${lvl * 50}% Idle Dust` },
                { name: "Bulk Growth", desc: (lvl) => `Stack up to ${1 + lvl} Seeds` }
            ],
            soy: [
                { name: "Soy Multiplier", desc: (lvl) => `x${1 + lvl} Crop Gain` },
                { name: "Milestone Soil", desc: (lvl) => `x${(1 + lvl * 0.1).toFixed(1)} Global Mult` },
                { name: "Tofu Power", desc: (lvl) => `${lvl * 2}% Diamond Chance` }
            ],
            potato: [
                { name: "Potato Multiplier", desc: (lvl) => `x${1 + lvl} Crop Gain` },
                { name: "Gem Roots", desc: (lvl) => `+${lvl * 3}% Rare Gem Find` },
                { name: "Mashed Essence", desc: (lvl) => `x${1 + lvl} Grain Value` }
            ],
            pumpkin: [
                { name: "Pumpkin Multiplier", desc: (lvl) => `x${1 + lvl} Crop Gain` },
                { name: "Spirit Blessing", desc: (lvl) => `${lvl}% Golden Chance` },
                { name: "Jack's Fortune", desc: (lvl) => `Max Roll: ${2 + lvl}x` }
            ]
        };

        function initUI() {
            // Inside initUI() loop
            let cost;
            if (i === 2) { // Bulk Growth Upgrade
                // Base 5, but costs 5x more every single level (5, 25, 125, 625...)
                cost = Math.floor(5 * Math.pow(5.0, lvl)); 
            } else {
                // Standard upgrades stay at 1.15x
                cost = Math.floor((cropBase + stagger) * Math.pow(1.15, lvl));
            }

            const sb = document.getElementById('crop-sidebar');
            sb.innerHTML = '<h3>Crops</h3>';
            Object.keys(CROPS).forEach(id => {
                const unlocked = state.unlockedCrops.includes(id);
                sb.innerHTML += `<div class="crop-select ${unlocked?'unlocked':''} ${state.selectedCrop===id?'active':''}" onclick="selectCrop('${id}')">
                    ${CROPS[id].icon}<br>${id.toUpperCase()}
                </div>`;
            });

            document.getElementById('inv-bar').innerHTML = Object.keys(state.cropInventory)
                .map(k => `<div>${CROPS[k].icon} ${format(state.cropInventory[k])}</div>`).join('') + `<div>💰 ${format(state.essence)}</div>`;
            const upGrid = document.getElementById('upgrade-grid');
            document.getElementById('up-title').innerText = `${state.selectedCrop.toUpperCase()} Upgrades`;
            upGrid.innerHTML = '';

            for(let i=0; i<3; i++) {
                let lvl = state.upgrades[state.selectedCrop][i];
                const basePrices = { wheat: 10, corn: 15, soy: 30, potato: 40, pumpkin: 50 };
                let cropBase = basePrices[state.selectedCrop] || 10;

                let stagger = i * (cropBase * 2); 
                let cost = Math.floor((cropBase + stagger) * Math.pow(1.2, lvl));
                // Inside initUI() loop

                let def = UPGRADE_DEFS[state.selectedCrop][i];

                upGrid.innerHTML += `
                    <div class="up-card">
                        <b>${def.name} (Lvl ${lvl})</b><br>
                        <!-- This calls the 'desc' function we made in Step 1 -->
                        <small style="color: #81c784;">${def.desc(lvl)}</small><br>
                        
                        <button onclick="buyUp(${i}, ${cost})" 
                            ${state.cropInventory[state.selectedCrop] < cost ? 'disabled' : ''}>
                            Upgrade [${format(cost)} ${state.selectedCrop}]
                        </button>
                    </div>`;
            }


            // Expand Plots
            const pCost = Math.floor(10 * Math.pow(4, state.plots - 1));
            document.getElementById('p-cost').innerText = format(pCost);
            document.getElementById('p-type').innerText = "WHEAT";
            document.getElementById('expand-btn').disabled = state.cropInventory.wheat < pCost;
            // Add these at the bottom of your initUI() function
            document.getElementById('gold-count').innerText = format(state.goldenCrops || 0);
            document.getElementById('diam-count').innerText = format(state.diamondCrops || 0);


            // Unlock Next Crop
            const nextIdx = state.unlockedCrops.length;
            const nextId = Object.keys(CROPS)[nextIdx];
            if(nextId) {
                document.getElementById('uc-cost').innerText = format(CROPS[nextId].cost);
                document.getElementById('unlock-crop-btn').disabled = state.essence < CROPS[nextId].cost;
            } else {
                document.getElementById('unlock-crop-btn').style.display = 'none';
            }
        }

        function selectCrop(id) { if(state.unlockedCrops.includes(id)) { state.selectedCrop = id; save(); initUI(); } }

        async function handlePlot(i) {
            let p = state.ghCrops[i] || { status: 'empty' };
            const type = state.selectedCrop; // Current tab selection

            // 1. PLANTING
            // Inside handlePlot(i) - PLANTING SECTION
        if (p.status === 'empty' || (p.status === 'growing' && p.type === type)) {
            // Bulk Growth is Upgrade Index 2 (the 3rd one) for most crops
            let bulkLvl = state.upgrades[type][2] || 0; 
            let maxStack = 1 + bulkLvl; 
            let currentStack = p.stack || 0;

            if (currentStack < maxStack) {
                let globalSpeed = 1 + (state.upgrades.wheat[1] * 0.1);
                let specificSpeed = 1 + (state.upgrades[type][1] * 0.1);
                
                state.ghCrops[i] = { 
                    type: type, 
                    status: 'growing', 
                    progress: p.progress || 0,
                    stack: currentStack + 1, // Correctly increments stack
                    time: CROPS[type].time / (globalSpeed * specificSpeed)
                };
            }
        }


            // 2. HARVESTING
            else if (p.status === 'ready') {
                const hType = p.type; // BUG FIX: Use the plot's type, not selected tab
                const hUps = state.upgrades[hType];
                
                // CROP GAIN: Base x Multiplier
                let cropMult = 1 + hUps[0]; 
                if (hType === 'pumpkin' && hUps[2] > 0) cropMult *= await startJackRoll(hUps[2]);
                state.cropInventory[hType] += (p.stack || 1) * cropMult;

                // ESSENCE GAIN: Scales with TotalGain (EPS) and Crop Tier
                // Base Grain: 10% of EPS per level of Wheat Essence Grains
                let grainLvl = state.upgrades.wheat[2] || 0;
                let baseGrain = grainLvl * 0.1 * (state.totalGain || 1);
                let tierMult = { wheat:1, corn:3, soy:8, potato:20, pumpkin:50 }[hType];
                
                state.essence += baseGrain * tierMult * (p.stack || 1);

                // RARE CHANCE: Luck checks
                let roll = Math.random();
                // Golden (1% base) + Tofu Power bonus (Soy Upgrade 2)
                let goldLuck = 0.01 + (state.upgrades.soy[2] * 0.005);
                let diamLuck = 0.001 + (state.upgrades.soy[2] * 0.001);

                if (roll < diamLuck) {
                    state.diamondCrops = (state.diamondCrops || 0) + (p.stack || 1);
                } else if (roll < goldLuck) {
                    state.goldenCrops = (state.goldenCrops || 0) + (p.stack || 1);
                }

                state.ghCrops[i] = { status: 'empty' };
            }
            save(); renderGarden(); initUI();
        }


        
        function calculateDustyCornBonus() {
            let cornBonus = 0;
            if (state.upgrades.corn[1] > 0) {
                state.ghCrops.forEach(p => {
                    if (p && p.type === 'corn' && p.status === 'ready') {
                        cornBonus += (state.upgrades.corn[1] * 0.05); // 5% per ready corn
                    }
                });
            }
            return 1 + cornBonus;
        }

        // In your main click/income logic:
        // let totalDust = baseDust * calculateDustyCornBonus();


        function renderGarden() {
            const grid = document.getElementById('garden-grid');
            grid.innerHTML = '';
            for (let i=0; i<20; i++) {
                if (i < state.plots) {
                    let p = state.ghCrops[i] || { status: 'empty' };
                    grid.innerHTML += `<div class="plot ${p.status}" onclick="handlePlot(${i})">
                        <div class="crop-icon">${p.status !== 'empty' ? CROPS[p.type].icon : ''}</div>
                        <div class="progress-bar" style="width: ${p.status === 'growing' ? (p.progress/p.time)*100 : 0}%"></div>
                    </div>`;
                } else {
                    grid.innerHTML += `<div class="plot" style="opacity:0.2; cursor:not-allowed;"></div>`;
                }
            }
        }

        function buyUp(idx, cost) {
            if(state.cropInventory[state.selectedCrop] >= cost) {
                state.cropInventory[state.selectedCrop] -= cost;
                state.upgrades[state.selectedCrop][idx]++;
                save(); initUI();
            }
        }

        function unlockNewCrop() {
            const nextId = Object.keys(CROPS)[state.unlockedCrops.length];
            if(state.essence >= CROPS[nextId].cost) {
                state.essence -= CROPS[nextId].cost;
                state.unlockedCrops.push(nextId);
                save(); initUI();
            }
        }

        function expandPlot() {
            const cost = Math.floor(10 * Math.pow(4, state.plots - 1));
            if(state.cropInventory.wheat >= cost) {
                state.cropInventory.wheat -= cost;
                state.plots++;
                save(); initUI(); renderGarden();
            }
        }

        function sellRare(type) {
            if (type === 'gold' && state.goldenCrops > 0) {
                // Reward: 1000s of production per crop, boosted by Golden Efficiency
                let mult = 1 + ((state.rareUpgrades?.goldEff || 0) * 0.25);
                state.essence += state.goldenCrops * (state.totalGain * 1000) * mult;
                state.goldenCrops = 0;
            } else if (type === 'diam' && state.diamondCrops > 0) {
                // Reward: 1 hour of production per crop
                state.essence += state.diamondCrops * (state.totalGain * 3600);
                state.diamondCrops = 0;
            }
            save(); initUI();
        }

        function buyRareUp(id) {
            state.rareUpgrades = state.rareUpgrades || { goldEff: 0, diamMast: 0 };
            if (id === 'goldEff') {
                let cost = 10 + (state.rareUpgrades.goldEff * 5);
                if (state.goldenCrops >= cost) {
                    state.goldenCrops -= cost;
                    state.rareUpgrades.goldEff++;
                }
            } else if (id === 'diamMast') {
                let cost = 5 + (state.rareUpgrades.diamMast * 3);
                if (state.diamondCrops >= cost) {
                    state.diamondCrops -= cost;
                    state.rareUpgrades.diamMast++;
                }
            }
            save(); initUI();
        }



        setInterval(() => { renderGarden(); initUI(); }, 500);
        window.onload = () => { initUI(); renderGarden(); };
    </script>
</body>
</html>
